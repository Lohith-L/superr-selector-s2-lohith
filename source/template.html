const D=JSON.parse(document.getElementById('data').textContent);
const f=(x,d=1)=>(x==null||isNaN(x))?'–':(+x).toFixed(d);
const DEF={ti:2,minB:100,minM:12,w:[65,25,10],comp:'both',seasons:[2022,2023,2024,2025,2026]};
let S=JSON.parse(JSON.stringify(DEF)),ROLE='bat',ALL=false,CMP=['','',''];
const TOP=[40,33,25,20,15,10],cache={};
const pidx={bat:{},bowl:{}},pubBy={bat:{},bowl:{}};
['bat','bowl'].forEach(r=>{D[r].players.forEach((p,i)=>pidx[r][p.id]=i);D.pub[r].forEach(x=>pubBy[r][x.player_id]=x)});
const isDef=()=>S.ti==2&&S.minB==100&&S.minM==12&&S.w.join()==DEF.w.join()&&S.comp=='both'&&S.seasons.length==5;
function keep(r,i){if(S.comp=='IPL'&&!r.l[i])return false;if(S.comp=='T20I'&&r.l[i])return false;return S.seasons.includes(Math.floor(r.d[i]/10000))}
function calc(role){
 const key=role+JSON.stringify(S);if(cache[key])return cache[key];
 const j=D[role],r=j.rows,N=j.players.length,ti=S.ti,th=j.thresholds[ti],Z=()=>new Float64Array(N);
 const nh=Z(),ph=Z(),rh=Z(),na=Z(),ra=Z(),m=Z(),pos=Z(),a=r['nh'+ti],b=r['ph'+ti],c=r['rh'+ti];
 for(let i=0;i<r.p.length;i++){if(!keep(r,i))continue;const p=r.p[i];nh[p]+=a[i];ph[p]+=b[i];rh[p]+=c[i];na[p]+=r.na[i];ra[p]+=r.ra[i];if(a[i]>=3){m[p]++;if(b[i]>0)pos[p]++}}
 let L=[];
 for(let p=0;p<N;p++){if(nh[p]>=S.minB&&m[p]>=S.minM){const us=ra[p]/(na[p]+150);L.push({i:p,...j.players[p],nh:nh[p],m:m[p],usual:us*100,H:(rh[p]+150*us)/(nh[p]+150)*100,A:(ph[p]+th.k_pae*th.mu_pae)/(nh[p]+th.k_pae)*100,C:(pos[p]+6*th.mu_pos)/(m[p]+6)})}}
 const st=k=>{const mu=L.reduce((s,x)=>s+x[k],0)/L.length,sd=Math.sqrt(L.reduce((s,x)=>s+(x[k]-mu)**2,0)/(L.length-1));return[mu,sd]};
 const[mH,sH]=st('H'),[mA,sA]=st('A'),[mC,sC]=st('C'),W=S.w,T=(W[0]+W[1]+W[2])||1;
 L.forEach(x=>x.score=(W[0]*(x.H-mH)/sH+W[1]*(x.A-mA)/sA+W[2]*(x.C-mC)/sC)/T);
 L.sort((x,y)=>y.score-x.score);L.forEach((x,k)=>x.rank=k+1);
 const by={};L.forEach(x=>by[x.id]=x);return cache[key]={L,by,tot:{nh,ph,na}};
}
function series(role,pi){const j=D[role],r=j.rows,o=[];for(let i=0;i<r.p.length;i++)if(r.p[i]==pi&&keep(r,i))o.push([r.d[i],r['ph'+S.ti][i],r['nh'+S.ti][i]]);return o.sort((x,y)=>x[0]-y[0])}
/*UI*/
const av=(n,s=32)=>{const t=n.replace(/\./g,' ').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();return`<svg width="${s}" height="${s}" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="#0B1F4B" stroke="#E5207F" stroke-width="6"/><text x="48" y="59" text-anchor="middle" font-size="32" font-weight="700" style="fill:#fff;font-family:Sora,sans-serif">${t}</text></svg>`};
const $=s=>document.querySelector(s),app=$('#app');
const NAV=[['overview','Overview'],['evidence','Evidence'],['rankings','Rankings'],['compare','Compare']];
function route(){const h=location.hash.slice(1)||'overview',m=h.match(/^p-(bat|bowl)-(\d+)$/);window.scrollTo(0,0);
 $('#nav').innerHTML=NAV.map(([k,t])=>`<a href="#${k}" class="${(m?'rankings':h)==k?'on':''}">${t}</a>`).join('');
 if(m)player(m[1],+m[2]);else if(h=='evidence')evidence();else if(h=='rankings')rankings();else if(h=='compare')compare();else overview();
 document.title=(m&&D[m[1]].players[pidx[m[1]][+m[2]]]?D[m[1]].players[pidx[m[1]][+m[2]]].name+' | ':'')+'Who delivers when it matters?'}
const F=D.facts,V=D.ev.validation,V2=D.ev.validation_v2,T1='T1 future pressure runs above expected',T2='T2 future RAW pressure runs per ball',T3='T3 future pressure win-prob added per ball';
const hiList=r=>D.pub[r].filter(x=>((D.squad[r]||{})[x.player_id]||{}).need=='Higher').map(x=>`<a class="top" href="#p-${r}-${x.player_id}"><span class="rk">${x.rank}</span>${av(x.name)}<span><b>${x.name}</b><br><span class="sm">${x.role}</span></span></a>`).join('')||'<p class="sm">None</p>';
function overview(){const tb=D.pub.bat.slice(0,3),tw=D.pub.bowl.slice(0,3);
 const tp=(a,r)=>a.map(x=>`<a class="top" href="#p-${r}-${x.player_id}"><span class="rk">${x.rank}</span>${av(x.name)}<span><b>${x.name}</b><br><span class="sm">${x.role}, ${x.hp_balls} pressure balls</span></span></a>`).join('');
 app.innerHTML=`<section class="hero"><div><div class="eb">SupeRR Selector Season 2, Round 1 | Submission by Lohith L</div><h1>Who delivers when it matters?</h1>
 <p class="lead">I scored every ball in ${F.matches} IPL and T20I matches for pressure, then rated every batter and bowler on what they did in the moments that decided games. This site shows how I did it, step by step, and lets you test my conclusions yourself.</p>
 <a class="btn" href="#rankings">See my final top 10s</a><a class="btn g" href="#evidence">Read my methodology</a></div></section>
 <h2>The question I set out to answer</h2><p>The brief asks who performs most reliably under pressure, compared with their usual level. I treated it as a measurement problem with three hard parts: defining pressure without arbitrary cut-offs, comparing players fairly across competitions and sample sizes, and proving the ratings are reliable rather than lucky.</p>
 <h2>My approach in five steps</h2><div class="grid">
 ${[['Data and cleaning',`extras1_runs is a type code, not runs. Wides and byes have no stored run values. The winning delivery is missing in ${F.missing_final} of ${F.winning_chases} successful chases. I corrected for each.`],['Defining pressure','A cross-fitted win-probability model. Pressure is leverage: the size of the win-probability swing one ball can cause. The top 25% of balls are high pressure.'],['Rating players','Each player is compared with what an average player does in the same situation against similar opposition. Small samples are shrunk toward his own usual level.'],['Results','My top 10 batters and bowlers, with confidence ranges and bootstrap stability.'],['Validation','Do the ratings predict future pressure performance, and how do the top 10s change under alternative assumptions?']].map((s,i)=>`<div class="card step"><em>0${i+1}</em><h3>${s[0]}</h3><p class="sm">${s[1]}</p></div>`).join('')}</div>
 <h2>What I found</h2><div class="grid">
 <div class="card"><b class="n">Mostly noise</b><p class="sm">Pressure samples are small, so popular clutch statistics barely repeat from one half of the data to the other.</p></div>
 <div class="card"><b class="n">Beats death-over stats</b><p class="sm">On future win-probability impact under pressure, my rating scores ${f(V2.bat['My rating'][T3],2)} for batters and ${f(V2.bowl['My rating'][T3],2)} for bowlers, against ${f(V2.bat['Naive death-over SR/econ'][T3],2)} and ${f(V2.bowl['Naive death-over SR/econ'][T3],2)} for death-over strike rate and economy. On raw runs, simple overall strike rate predicts better, and the Evidence page says so.</p></div>
 <div class="card"><b class="n">6 to 10 of 10</b><p class="sm">Names kept when I change the pressure level, weights or shrinkage. Restricting to IPL only, T20Is only or one era keeps 5 to 7, so I show every player’s robustness.</p></div></div>
 <h2>My final top 3</h2><div class="grid g2"><div class="card"><h3>Batters</h3>${tp(tb,'bat')}</div><div class="card"><h3>Bowlers</h3>${tp(tw,'bowl')}</div></div>
 <h2>By the numbers</h2><div class="grid">${[[F.matches,'matches analysed'],[F.deliveries.toLocaleString(),'deliveries'],[F.batters+' / '+F.bowlers,'batters / bowlers'],[F.eligible_batters+' / '+F.eligible_bowlers,'eligible batters / bowlers']].map(x=>`<div class="card"><b class="n">${x[0]}</b><span class="sm">${x[1]}</span></div>`).join('')}</div>
 <h2>Where this meets the auction</h2><div class="card"><p>The brief asks how each player could strengthen Rajasthan Royals, so each of my top 20 has a squad-fit note, judged against RR’s 2026 squad. My top batter, Vaibhav Sooryavanshi, is already at RR and scored 776 runs in 2026, so I would retain him and use him as the benchmark. RR open with Jaiswal and Sooryavanshi, so openers rate as lower need. The higher-need calls are finishing batters and death-overs bowlers. Retention lists are due on 17 November, so these calls are provisional.</p>
 <div class="grid g2"><div><h3>Higher need: batters</h3>${hiList('bat')}</div><div><h3>Higher need: bowlers</h3>${hiList('bowl')}</div></div></div>
 <h2>What I would want you to challenge</h2><div class="card"><p>Even my largest pressure samples are a few hundred balls, so rank order inside each list is uncertain. Batting ratings do not predict well across years. The winning ball is missing in about 29% of successful chases, and wide and bye runs are imputed. I had no pitch or venue-par data, and T20I opposition varies widely, and restricting to IPL matches or one era keeps only five to seven of my ten names. The Evidence page shows each of these in numbers.</p></div>
 <h2>Explore my analysis</h2><p>The rankings page recalculates live in your browser. Change the pressure level, the minimum sample, the weights, the competition or the seasons and watch the order move. Click any player for his profile.</p><a class="btn" href="#rankings" style="color:#fff">Open the rankings</a>`}
function evidence(){const lo=D.ev.leverage_by_over,ov=Object.keys(lo).map(Number).sort((a,b)=>a-b),mx=Math.max(...ov.map(o=>Math.max(...lo[o])));
 const X=o=>40+(o-1)*(540/19),Y=v=>170-v/mx*150,line=k=>ov.map(o=>X(o)+','+Y(lo[o][k])).join(' ');
 const vb=(w)=>Object.entries(V[w].random).filter(([k])=>!k.startsWith('__')).map(([k,v])=>`<div class="sm">${k}: <b style="color:var(--tx)">${f(v,3)}</b></div><div class="vb"><i class="${k.startsWith('My')?'me':''}" style="width:${v/.35*100}%"></i></div>`).join('');
 const vt=w=>`<div class="card sc"><h3>${w=='bat'?'Batters':'Bowlers'}</h3><table><thead><tr><th colspan="3">Method</th><th>Adj. runs</th><th>Raw runs</th><th>Win prob.</th></tr></thead><tbody>${[['My rating','My pressure rating'],['Usual level (all-ball RAE)','Usual level'],['Raw overall SR/econ (unadjusted)','Overall SR / economy'],['Naive death-over SR/econ','Naive death-over']].map(([k,l])=>`<tr style="cursor:default"><td colspan="3">${l}</td><td>${f(V2[w][k][T1],2)}</td><td>${f(V2[w][k][T2],2)}</td><td>${f(V2[w][k][T3],2)}</td></tr>`).join('')}</tbody></table></div>`;
 const rt=r=>`<div class="card sc"><h3>${r=='bat'?'Batters':'Bowlers'}</h3><table><thead><tr><th>#</th><th colspan="2">Player</th><th>Lenses held (of 6)</th><th>Confidence</th></tr></thead><tbody>${D.pub[r].slice(0,10).map(x=>{const k=D.robust[r][x.player_id].k;return`<tr style="cursor:default"><td>${x.rank}</td><td colspan="2">${x.name}</td><td>${k}</td><td>${k>=5?'High':k==4?'Medium':'Lower'}</td></tr>`}).join('')}</tbody></table></div>`;
 const sp=D.ev.separation;
 app.innerHTML=`<h1 style="font-size:36px;margin-top:30px">Evidence and method</h1><p class="mu">Everything here is computed from the 784 eligible matches. Written as I worked through it.</p>
 <h2>1. Cleaning the data</h2><p>I kept ${F.matches} matches (${F.ipl_matches} IPL, ${F.t20i_matches} T20I) and ${F.deliveries.toLocaleString()} of ${F.raw_deliveries.toLocaleString()} raw deliveries. I dropped ${F.dropped.a_team} A-team matches, ${F.dropped.dls} DLS games, ${F.dropped.no_result} no-results and ${F.dropped.missing_innings} matches with a missing innings, plus all super overs. Extras were imputed and checked against run margins: the reconstructed margin was off by ${F.extras_err} runs on average, against ${F.extras_err_ignored} if extras were ignored.</p>
 <h2>2. Defining pressure</h2><p>A win-probability model for each innings, cross-fitted by match (chase AUC ${f(F.wp_auc_chase,3)}, first innings ${f(F.wp_auc_inn1,3)}). Leverage is the probability-weighted size of the win-probability change a ball can cause. High pressure is the top 25% of deliveries by leverage. No hand-picked cut-offs.</p>
 <div class="card sc"><h3>Mean leverage by over</h3><svg viewBox="0 0 600 200" width="100%" role="img" aria-label="Leverage by over for both innings"><line x1="40" y1="170" x2="580" y2="170" stroke="var(--ln)"/><polyline fill="none" stroke="var(--tx)" stroke-opacity=".5" stroke-width="2.5" points="${line(0)}"/><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${line(1)}"/>${[1,5,10,15,20].map(o=>`<text x="${X(o)}" y="188" text-anchor="middle">${o}</text>`).join('')}<text x="48" y="18">First innings (grey), chase (pink)</text></svg></div>
 <div class="card sc" style="margin-top:12px"><h3>Does it separate pressure from ordinary play?</h3><table><thead><tr><th>Innings</th><th>Pressure</th><th>Runs/ball</th><th>Wicket %</th><th>Dot %</th><th>Win-prob swing %</th></tr></thead><tbody>${sp.map(x=>`<tr style="cursor:default"><td>${x.innings}</td><td>${x.pressure}</td><td>${f(x.runs_per_ball,2)}</td><td>${f(x.wkt_pct)}</td><td>${f(x.dot_pct)}</td><td>${f(x.avg_swing_pct,2)}</td></tr>`).join('')}</tbody></table><p class="sm">A typical high-pressure ball moves the win probability three to five times as much as an ordinary one.</p></div>
 <h2>3. Rating players</h2><div class="card"><p><b>H</b> = (pressure runs above expected + 150 × usual level) ÷ (pressure balls + 150) × 100. <b>A</b> = win probability added above expected per 100 pressure balls, shrunk to the league mean. <b>C</b> = share of pressure innings with positive impact, shrunk. Score = 65% H + 25% A + 10% C, each standardised across eligible players. Eligible: 100+ pressure balls over 12+ innings.</p><p class="sm">“Above expected” means against a model of the same match state, competition, pace or spin and opposition quality, so openers, finishers and weaker T20I sides are each compared like for like.</p></div>
 <h2>4. Can I trust it?</h2><p>I tested the ratings out of sample: ratings built from a random half of the matches, checked against the other half, 30 times over (Spearman rho). What the rating is asked to predict matters, so I used three targets: future pressure runs above expected, future raw pressure runs per ball (no model involved), and future win probability added under pressure.</p><div class="grid g2">${vt('bat')}${vt('bowl')}</div>
 <p>Three results stand out. On win probability added, the target closest to winning matches, my rating is far ahead of the naive death-over measure (batters ${f(V2.bat['My rating'][T3],2)} against ${f(V2.bat['Naive death-over SR/econ'][T3],2)}, bowlers ${f(V2.bowl['My rating'][T3],2)} against ${f(V2.bowl['Naive death-over SR/econ'][T3],2)}) and, for bowlers, is the best predictor of all. On context-adjusted runs it predicts about twice as well as the naive measure. On raw pressure runs, which mostly reflect a player’s role, plain overall strike rate or economy predicts better than my rating, and a batter’s own usual level edges it on the other two targets. I read that as most pressure skill being general quality, with my method adding a modest pressure tilt that I keep because the brief asks for the comparison. On a chronological split (early years predicting later) batters barely predict (rho ${f(V.bat.time['My pressure rating'],2)}) while bowlers do much better (${f(V.bowl.time['My pressure rating'],2)}).</p>
 <div class="card sc"><h3>How many of my top-10 names stay put under alternative settings</h3><table><thead><tr><th>Alternative</th><th></th><th></th><th>Batters</th><th>Bowlers</th></tr></thead><tbody>${Object.entries(D.ev.sensitivity).map(([k,v])=>`<tr style="cursor:default"><td colspan="3">${k}</td><td>${v.bat}</td><td>${v.bowl}</td></tr>`).join('')}<tr style="cursor:default"><td colspan="3">Naive death-over top 10</td><td>${D.ev.naive.bat_overlap}</td><td>${D.ev.naive.bowl_overlap}</td></tr></tbody></table></div>
 <p>Between six and ten names survive every one of these changes. Changing the data lens is more disruptive: re-running the rating on IPL matches only, T20Is only or one era keeps only five to seven names, so the list depends on which data I look at. I therefore count, for every player, in how many of six alternative lenses he still ranks in the top 25.</p>
 <div class="card sc"><h3>Names kept under each data lens (of 10)</h3><table><thead><tr><th colspan="3">Lens</th><th>Batters</th><th>Bowlers</th></tr></thead><tbody>${['IPL only','T20I only','2022 to 2024','2025 to 2026'].map(n=>`<tr style="cursor:default"><td colspan="3">${n}</td><td>${D.ev.lenses_kept.bat[n]}</td><td>${D.ev.lenses_kept.bowl[n]}</td></tr>`).join('')}</tbody></table></div>
 <h3 style="margin-top:18px">Robustness of my top 10s</h3><div class="grid g2">${rt('bat')}${rt('bowl')}</div><p class="sm">The lenses are IPL only, T20Is only, 2022 to 2024, 2025 to 2026, top 15% pressure and top 33% pressure. High means he holds a top-25 place in five or six. I kept the ranking unchanged because it follows the method I set out in advance; I did not re-rank after seeing these results.</p>
 <h2>5. Limits</h2><p>Small pressure samples; weak long-range prediction for batters; the missing winning delivery (${F.missing_final} of ${F.winning_chases} chases); imputed extras; no pitch or venue-par data; uneven T20I opposition; and a ranking that depends on the data lens (IPL only or one era keeps five to seven of ten names). Rank intervals and top-10 probabilities come from 200 bootstrap resamples of whole matches.</p>`}
function rankings(){
 const seas=DEF.seasons;
 app.innerHTML=`<h1 style="font-size:36px;margin-top:30px">My rankings, recalculated live</h1><p class="mu">Change anything and the table recomputes in your browser using my formulas. Click a player for his profile.</p>
 <div class="tabs" role="tablist"><button data-r="bat" role="tab">Batters</button><button data-r="bowl" role="tab">Bowlers</button></div>
 <div class="card"><div class="ctl"><div><label for="ti">Pressure level</label><select id="ti">${TOP.map((t,i)=>`<option value="${i}">Top ${t}% of balls</option>`).join('')}</select></div>
 <div><label>Minimum pressure balls: <b id="vB"></b></label><input type="range" id="mb" min="60" max="200" step="10"></div>
 <div><label>Weight on H (pressure runs): <b id="vH"></b></label><input type="range" id="wh" min="0" max="100" step="5"></div>
 <div><label>Weight on A (win prob. added): <b id="vA"></b></label><input type="range" id="wa" min="0" max="100" step="5"></div>
 <div><label>Weight on C (consistency): <b id="vC"></b></label><input type="range" id="wc" min="0" max="100" step="5"></div>
 <div><label for="cp">Competition</label><select id="cp"><option value="both">IPL and T20I</option><option>IPL</option><option>T20I</option></select></div></div>
 <div>${seas.map(y=>`<button class="chip" data-y="${y}">${y}</button>`).join('')} <button class="tg" id="rs" style="margin-left:8px">Reset to my defaults</button> <span id="bd" class="badge"></span></div></div>
 <div class="card sc" style="margin-top:12px"><table><thead><tr><th>#</th><th>Player</th><th>Role</th><th>Pressure balls</th><th>H</th><th>Usual</th><th>Lift</th><th>A /100</th><th>C</th><th>Vs my rank</th><th>90% rank range</th></tr></thead><tbody id="tb"></tbody></table>
 <button class="tg" id="mr" style="margin-top:10px"></button><p class="sm">H = pressure runs above expected per 100 balls, shrunk to the player’s own usual level. Lift = H minus usual. Rank ranges exist for my published settings only.</p></div>`;
 const sync=()=>{$('#ti').value=S.ti;$('#mb').value=S.minB;$('#vB').textContent=S.minB;['h','a','c'].forEach((k,i)=>{$('#w'+k).value=S.w[i];$('#v'+k.toUpperCase()).textContent=Math.round(S.w[i]/((S.w[0]+S.w[1]+S.w[2])||1)*100)+'%'});$('#cp').value=S.comp;
  document.querySelectorAll('[data-y]').forEach(b=>b.classList.toggle('on',S.seasons.includes(+b.dataset.y)));document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r==ROLE));
  const ok=isDef();$('#bd').textContent=ok?'Matches my published ranking':'Custom settings';$('#bd').className='badge'+(ok?' ok':'')};
 const draw=()=>{sync();const R=calc(ROLE),n=ALL?25:10,def=isDef();
  $('#tb').innerHTML=R.L.slice(0,n).map(x=>{const pb=pubBy[ROLE][x.id],mv=pb?pb.rank-x.rank:null;const lo=pb&&def?pb.rank_lo:null,hi=pb&&def?pb.rank_hi:null;
   return`<tr tabindex="0" data-id="${x.id}"><td><b style="color:var(--ac)">${x.rank}</b></td><td><div class="nm">${av(x.name)}<a href="#p-${ROLE}-${x.id}">${x.name}</a></div></td><td>${x.role}</td><td>${x.nh}</td><td><b>${f(x.H)}</b></td><td>${f(x.usual)}</td><td>${f(x.H-x.usual)}</td><td>${f(x.A,2)}</td><td>${f(100*x.C,0)}%</td><td class="${mv>0?'up':mv<0?'dn':''}">${mv==null?'new':mv>0?'▲ '+mv:mv<0?'▼ '+(-mv):'–'}</td><td>${lo!=null?`<span class="wh"><b style="left:${Math.min(lo,40)/40*100}%;width:${(Math.min(hi,40)-Math.min(lo,40))/40*100}%"></b><u style="left:${Math.min(x.rank,40)/40*100}%"></u></span> ${Math.round(lo)} to ${Math.round(hi)}`:'–'}</td></tr>`}).join('')||'<tr><td colspan="11">No players meet these settings.</td></tr>';
  $('#mr').textContent=ALL?'Show top 10 only':'Show ranks 11 to 25'};
 const upd=()=>{draw()};
 $('#ti').onchange=e=>{S.ti=+e.target.value;upd()};$('#mb').oninput=e=>{S.minB=+e.target.value;upd()};
 ['h','a','c'].forEach((k,i)=>$('#w'+k).oninput=e=>{S.w[i]=+e.target.value;upd()});$('#cp').onchange=e=>{S.comp=e.target.value;upd()};
 document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const y=+b.dataset.y,s=S.seasons;if(s.includes(y)){if(s.length>1)S.seasons=s.filter(v=>v!=y)}else S.seasons=[...s,y].sort();upd()});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ROLE=b.dataset.r;upd()});
 $('#rs').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));upd()};$('#mr').onclick=()=>{ALL=!ALL;upd()};
 $('#tb').onclick=e=>{if(e.target.closest('a'))return;const tr=e.target.closest('tr[data-id]');if(tr)location.hash='p-'+ROLE+'-'+tr.dataset.id};
 $('#tb').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){const tr=e.target.closest('tr[data-id]');if(tr){e.preventDefault();location.hash='p-'+ROLE+'-'+tr.dataset.id}}};
 draw()}
function player(role,id){const pi=pidx[role][id];ROLE=role;
 if(pi==null){app.innerHTML=`<a class="back" href="#rankings">Back to rankings</a><h1 style="font-size:32px">Player not found</h1><p>That player is not in my rated pool.</p>`;return}
 const p=D[role].players[pi],R=calc(role),x=R.by[id],pb=pubBy[role][id],tot=R.tot,def=isDef(),ser=series(role,pi);
 const order=R.L.map(q=>q.id),at=order.indexOf(id),prev=order[at-1],next=order[at+1];
 const b=x?'':'<p class="badge">Not eligible under the current settings</p>';const sq=(D.squad[role]||{})[id],rb=(D.robust[role]||{})[id];
 let chart='';if(ser.length){const W=620,H=150,mx=Math.max(...ser.map(s=>Math.abs(s[1])),.01),bw=Math.max(2,Math.min(14,(W-60)/ser.length-2));
  chart=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Win probability added above expected in each match under pressure"><line x1="30" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--ln)"/>${ser.map((s,i)=>{const h=Math.abs(s[1])/mx*(H/2-4),xx=34+i*((W-44)/ser.length);return`<rect x="${xx}" width="${bw}" y="${s[1]>=0?H/2-h:H/2}" height="${Math.max(h,1)}" fill="${s[1]>=0?'var(--ac)':'var(--tx)'}" fill-opacity="${s[1]>=0?1:.45}"><title>${String(s[0]).replace(/(\d{4})(\d\d)(\d\d)/,'$1-$2-$3')}: ${f(s[1]*100,1)} win prob. points, ${s[2]} pressure balls</title></rect>`}).join('')}<text x="30" y="${H+16}">Match by match, oldest to newest (pink = positive impact)</text></svg>`}
 const ev=x?(x.nh<150?'with caution: ':x.nh<300?'as moderately reliable: ':'as well supported: '):'';
 app.innerHTML=`<a class="back" href="#rankings">← Back to rankings</a>
 <div style="display:flex;gap:16px;align-items:center;margin:14px 0">${av(p.name,84)}<div><h1 style="font-size:34px;margin:0;color:var(--tx)">${p.name}</h1><div class="mu">${p.role}, ${p.ipl_pct}% of balls in the IPL, the rest in T20Is</div><div style="margin-top:6px">${x?`<span class="badge ${def?'ok':''}">Rank ${x.rank} of ${R.L.length}${def?' | matches my published ranking':' | custom settings'}</span>`:''} ${pb?`<span class="badge">My published rank: ${pb.rank}</span>`:''}</div></div></div>${b}
 ${x?`<div class="kp"><div><b>${f(x.H)}</b><span class="sm">pressure runs above expected per 100 balls</span></div><div><b>${f(x.usual)}</b><span class="sm">usual level, all situations</span></div><div><b>${x.H-x.usual>=0?'+':''}${f(x.H-x.usual)}</b><span class="sm">pressure lift on usual level</span></div><div><b>${f(x.A,2)}</b><span class="sm">win probability added above expected per 100 pressure balls</span></div><div><b>${f(100*x.C,0)}%</b><span class="sm">pressure innings with positive impact</span></div><div><b>${x.nh}</b><span class="sm">pressure balls over ${x.m} innings</span></div></div>
 <div class="card"><p style="margin:0">I treat this rating ${ev}it rests on ${x.nh} pressure balls over ${x.m} innings. ${pb&&def?`In 90% of my 200 resamples he finishes between ${Math.round(pb.rank_lo)} and ${Math.round(pb.rank_hi)}, and in the top 10 in ${Math.round(100*pb.p_top10)}% of them.`:'Rank ranges are available for my published settings.'} ${pb?`His traditional ${role=='bat'?'strike-rate':'economy'} rank among the same players is ${pb.trad_rank}${pb.gain>=10?', so the pressure view places him '+pb.gain+' places higher.':'.'}`:''}</p></div>`:''}
 ${rb?`<div class="card" style="margin-top:12px"><p style="margin:0"><b>Robustness:</b> he stays in the top 25 in ${rb.k} of 6 alternative lenses (${Object.entries(rb.ranks).map(([k,v])=>k+': '+(v?'rank '+v:'not eligible')).join('; ')}). I treat him as a ${rb.k>=5?'high':rb.k==4?'medium':'lower'}-confidence pick.</p></div>`:''}${sq?`<h2>Fit with Rajasthan Royals</h2><div class="card"><p><span class="badge">Need: ${sq.need}</span></p><p style="margin:6px 0 0">${sq.text}</p><p class="sm">Judged against RR’s 2026 squad. Retention lists for IPL 2027 are due on 17 November, so this may change.</p></div>`:''}<h2>Impact in each match under pressure</h2><div class="card sc">${chart||'<p>No matches under the current filters.</p>'}</div>
 <p style="margin-top:18px"><a class="btn" style="margin:0 8px 8px 0;color:#fff" href="#compare" onclick="CMP=['${role}:${id}','','']">Compare with another player</a>${prev?`<a class="tg" style="text-decoration:none;display:inline-block;padding:9px 14px" href="#p-${role}-${prev}">← Previous in ranking</a> `:''}${next?`<a class="tg" style="text-decoration:none;display:inline-block;padding:9px 14px" href="#p-${role}-${next}">Next in ranking →</a>`:''}</p>`}
function compare(){const R=calc(ROLE),opts=R.L.map(x=>`<option value="${ROLE}:${x.id}">${x.rank}. ${x.name}</option>`).join('');
 app.innerHTML=`<h1 style="font-size:36px;margin-top:30px">Compare players</h1><p class="mu">Pick two or three players of the same type. The numbers use whatever settings you last chose on the rankings page.</p>
 <div class="tabs"><button data-r="bat">Batters</button><button data-r="bowl">Bowlers</button></div><div class="ctl">${[0,1,2].map(i=>`<div><label for="c${i}">Player ${i+1}</label><select id="c${i}"><option value="">${i==2?'(optional)':'Choose'}</option>${opts}</select></div>`).join('')}</div><div id="cv"></div>`;
 document.querySelectorAll('[data-r]').forEach(b=>{b.classList.toggle('on',b.dataset.r==ROLE);b.onclick=()=>{ROLE=b.dataset.r;CMP=['','',''];compare()}});
 const sel=CMP.map(c=>c.startsWith(ROLE+':')?c:'');
 const show=()=>{const ids=[0,1,2].map(i=>$('#c'+i).value).filter(Boolean).map(v=>R.by[+v.split(':')[1]]).filter(Boolean);
  if(ids.length<2){$('#cv').innerHTML='<p class="mu">Choose at least two players.</p>';return}
  const rows=[['Rank (current settings)',x=>x.rank,0],['Pressure rating H',x=>f(x.H),1],['Usual level',x=>f(x.usual),1],['Pressure lift',x=>f(x.H-x.usual),1],['Win prob. added per 100',x=>f(x.A,2),1],['Consistency',x=>f(100*x.C,0)+'%',1],['Pressure balls',x=>x.nh,0],['Pressure innings',x=>x.m,0]];
  const best=ids.reduce((a,x)=>x.H>a.H?x:a),sec=[...ids].sort((a,b)=>b.A-a.A)[0];
  $('#cv').innerHTML=`<div class="card sc"><table><thead><tr><th></th><th></th><th></th>${ids.map(x=>`<th><a href="#p-${ROLE}-${x.id}" style="color:var(--tx)">${x.name}</a></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr style="cursor:default"><td colspan="3" class="mu">${r[0]}</td>${ids.map(x=>`<td>${r[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="card" style="margin-top:12px"><p style="margin:0">On my numbers, ${best.name} leads on pressure rating (${f(best.H)} per 100 balls)${sec.id!=best.id?`, while ${sec.name} leads on win probability added`:''}. ${ids.filter(x=>x.nh<150).map(x=>x.name).join(' and ')?`The evidence is thin for ${ids.filter(x=>x.nh<150).map(x=>x.name).join(' and ')}, who rest on fewer than 150 pressure balls.`:'All of them rest on more than 150 pressure balls.'}</p></div>`};
 [0,1,2].forEach(i=>{$('#c'+i).value=sel[i]||'';$('#c'+i).onchange=()=>{CMP[i]=$('#c'+i).value;show()}});show()}
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d=='dark'?'light':'dark'};
